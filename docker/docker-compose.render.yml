# ═══════════════════════════════════════════════════════════════
#  CareerForge n8n — Render Free Tier
#  SQLite + persistent disk. No Postgres (expires after 30 days).
#  Deploy via Render Blueprint (render.yaml) instead of this file.
#  This compose file is for reference / local testing of the
#  Render-equivalent configuration.
# ═══════════════════════════════════════════════════════════════

services:

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - TZ=${TIMEZONE:-UTC}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-careerforge}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - YOUCOM_API_KEY=${YOUCOM_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      # On Render, /home/node/.n8n is backed by a persistent disk
      - n8n_data:/home/node/.n8n
      - ./templates:/data/templates:ro
      - ./prompts:/data/prompts:ro
      - ./user-data:/data/user-data:ro
    depends_on:
      - latex
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  latex:
    build:
      context: ./services/latex
    restart: unless-stopped
    ports:
      - "5679:5679"

volumes:
  n8n_data:
