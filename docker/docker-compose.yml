# ═══════════════════════════════════════════════════════════════
#  CareerForge n8n — Local Dev Stack (Community Edition)
#  Run:  docker compose up -d   (from the docker/ folder)
#  UI:   http://localhost:5678
#
#  Sensitive config is in n8n credentials (encrypted), not env vars.
#  The few env vars below are for Code nodes that haven't been migrated
#  to credentials yet — all off the Round 1 critical path.
# ═══════════════════════════════════════════════════════════════

services:

  # ── n8n — Workflow Engine ──────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: careerforge_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Core
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - TZ=${TIMEZONE:-UTC}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-careerforge}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?set N8N_PASSWORD in docker/.env}

      # Database — SQLite for local
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite

      # Community nodes
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      # Reproducible installs (env-managed). WARNING: with MANAGED_BY_ENV=true n8n
      # reconciles installed community packages to EXACTLY this list on boot -- any
      # community package NOT listed here gets UNINSTALLED. Both currently-required
      # packages (Firecrawl, You.com) are listed; add any new one here BEFORE installing.
      - N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV=true
      - 'N8N_COMMUNITY_PACKAGES=["@mendable/n8n-nodes-firecrawl@2.1.2","@youdotcom-oss/n8n-nodes-youdotcom@0.2.9"]'
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # require('fs') for Parse Personal Info, Load Skeletons, Build Scorer Input
      # require('https') for Search Salary Data, You.com Research
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,https

      # API keys for Code nodes off Round 1 critical path
      # (Will migrate to credentials in later rounds)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - YOUCOM_API_KEY=${YOUCOM_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # ── ATS engine — job cache + embeddings + generation ──
      # (read in Code/HTTP nodes via $env; Postgres itself uses an n8n credential)
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama-service:11434}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - GEN_MODEL=${GEN_MODEL:-google/gemini-3.5-flash}
      # Per-ATS provider toggles (poller fan-out branches)
      - ATS_GREENHOUSE_ENABLED=${ATS_GREENHOUSE_ENABLED:-true}
      - ATS_LEVER_ENABLED=${ATS_LEVER_ENABLED:-true}
      - ATS_ASHBY_ENABLED=${ATS_ASHBY_ENABLED:-true}
      - ATS_WORKABLE_ENABLED=${ATS_WORKABLE_ENABLED:-true}
      - ATS_RECRUITEE_ENABLED=${ATS_RECRUITEE_ENABLED:-true}
      - ATS_PERSONIO_ENABLED=${ATS_PERSONIO_ENABLED:-true}
      - ATS_SMARTRECRUITERS_ENABLED=${ATS_SMARTRECRUITERS_ENABLED:-true}
      - ATS_WORKDAY_ENABLED=${ATS_WORKDAY_ENABLED:-false}
      - ATS_SCRAPE_ENABLED=${ATS_SCRAPE_ENABLED:-false}
      - LIVE_SEARCH_SUPPLEMENT=${LIVE_SEARCH_SUPPLEMENT:-false}
      # Find-time third-party board lanes -- default OFF (company-direct first; P0).
      # Opt in per-deploy; the IF: RemoteOK/Adzuna Disabled? gates read these via $env.
      - REMOTEOK_ENABLED=${REMOTEOK_ENABLED:-false}
      - ADZUNA_ENABLED=${ADZUNA_ENABLED:-false}

      # File access
      - N8N_RESTRICT_FILE_ACCESS_TO=/data;/home/node/.n8n-files
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_STORAGE_PATH=/home/node/.n8n/binaryData

      # UI preferences
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false

    volumes:
      - n8n_data:/home/node/.n8n
      - ../templates:/data/templates:ro
      - ../prompts:/data/prompts:ro
      - ../user-data:/data/user-data
      - ../data:/home/node/.n8n-files/companies:ro

    depends_on:
      latex:
        condition: service_started
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── LaTeX Compiler — PDF generation ────────────────────────
  latex:
    build:
      context: ../services/latex
    container_name: careerforge_latex
    hostname: latex-service
    restart: unless-stopped
    ports:
      - "5679:5679"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5679/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Matcher — cross-encoder rerank + skill graph (model-based match) ──
  #  Reranks top-N (resume, JD) pairs with bge-reranker-v2-m3 and computes an
  #  explainable skill overlap (direct + multi-hop adjacent via a bge-m3 embedding
  #  graph). CPU by default; set MATCHER_DEVICE=cuda + a CUDA base image for GPU.
  matcher:
    build:
      context: ../services/matcher
    container_name: careerforge_matcher
    hostname: matcher-service
    restart: unless-stopped
    ports:
      - "5680:5680"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama-service:11434}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - MATCHER_DEVICE=${MATCHER_DEVICE:-cpu}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - VALIDATE_TOP_N=${VALIDATE_TOP_N:-12}
      - RENDERER_URL=${RENDERER_URL:-http://renderer-service:8080}   # Tier 3 headless liveness (optional; unset -> Firecrawl only)
      # ── Discovery ingestion (Phase 1): PG cache write access ──
      - PGHOST=postgres-service
      - PGPORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-careerforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cf_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-careerforge}
      - INGEST_MAX_PER_PROVIDER=${INGEST_MAX_PER_PROVIDER:-250}
      - INGEST_EMBED_WORKERS=${INGEST_EMBED_WORKERS:-6}
      - ATS_DUE_LIMIT=${ATS_DUE_LIMIT:-120}           # boards polled per ATS per ingest run (curated tier polls first; freshness)
      # Third-party aggregator ingest -- default OFF (company-direct CORE). When true,
      # the remoteok provider registers into ingest; otherwise it never loads. (P1)
      - REMOTEOK_ENABLED=${REMOTEOK_ENABLED:-false}
      # ── Keyed providers (BYOK; absent = silently skipped, never errors) ──
      - FANTASTIC_API_KEY=${FANTASTIC_API_KEY}
      - JSEARCH_API_KEY=${JSEARCH_API_KEY}
      - APIFY_TOKEN=${APIFY_TOKEN}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY}
    volumes:
      - matcher_data:/app/data
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5680/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── renderer — Tier 3 headless liveness (optional, env-gated) ──
  #  Real Chromium renders SPA job pages to read their "no longer available"
  #  state (a plain HTTP status / bs4 can't -- dead Workday pages return 200).
  #  The matcher calls it (RENDERER_URL) only for jobs its JSON-API liveness
  #  can't resolve; if this service is absent the matcher degrades to Firecrawl.
  renderer:
    build:
      context: ../services/renderer
    container_name: careerforge_renderer
    hostname: renderer-service
    restart: unless-stopped
    ports:
      - "5681:8080"
    environment:
      - RENDER_MAX_CONCURRENCY=${RENDER_MAX_CONCURRENCY:-2}
      - RENDER_TIMEOUT_MS=${RENDER_TIMEOUT_MS:-25000}
      - RENDER_IDLE_MS=${RENDER_IDLE_MS:-8000}
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Postgres + pgvector — job cache & embeddings ───────────
  #  App data only (registry, jobs, résumé embeddings). n8n's own
  #  DB stays SQLite — this is reached via an n8n Postgres credential
  #  (host: postgres-service). schema.sql auto-runs on first boot.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: careerforge_postgres
    hostname: postgres-service
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-careerforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cf_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-careerforge}
    ports:
      - "5433:5432"          # host:5433 (5432 often taken); n8n uses postgres-service:5432 internally
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerforge} -d ${POSTGRES_DB:-careerforge}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Ollama — local bge-m3 embeddings (1024-d) ──────────────
  #  Default entrypoint (serve). The bge-m3 model is pulled by the
  #  one-shot ollama-init service below (more reliable than a custom
  #  entrypoint, which proved flaky). Healthcheck only verifies serve.
  ollama:
    image: ollama/ollama:latest
    container_name: careerforge_ollama
    hostname: ollama-service
    restart: unless-stopped
    ports:
      - "11434:11434"        # dev convenience; remove in prod
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Ollama init — pulls bge-m3 once, then exits ────────────
  #  Talks to the ollama server over the network (OLLAMA_HOST) so the
  #  model downloads into the shared ollama_data volume. Idempotent:
  #  a no-op once the model is present. Runs on every `up`, exits 0.
  ollama-init:
    image: ollama/ollama:latest
    container_name: careerforge_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama-service:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull bge-m3 && echo 'bge-m3 ready'"]
    restart: "no"

volumes:
  n8n_data:
  pg_data:
  ollama_data:
  matcher_data:
