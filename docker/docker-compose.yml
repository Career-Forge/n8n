# ═══════════════════════════════════════════════════════════════
#  CareerForge n8n — Local Dev Stack (Community Edition)
#  Run:  docker compose up -d   (from the docker/ folder)
#  UI:   http://localhost:5678
#
#  Sensitive config is in n8n credentials (encrypted), not env vars.
#  The few env vars below are for Code nodes that haven't been migrated
#  to credentials yet — all off the Round 1 critical path.
# ═══════════════════════════════════════════════════════════════

services:

  # ── n8n — Workflow Engine ──────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: careerforge_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Core
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
      - TZ=${TIMEZONE:-America/New_York}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-careerforge}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-demo1234}

      # Database — SQLite for local
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite

      # Community nodes
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # require('fs') for Parse Personal Info, Load Skeletons, Build Scorer Input
      # require('https') for Search Salary Data, You.com Research
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,https

      # API keys for Code nodes off Round 1 critical path
      # (Will migrate to credentials in later rounds)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - YOUCOM_API_KEY=${YOUCOM_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

      # File access
      - N8N_RESTRICT_FILE_ACCESS_TO=/data;/home/node/.n8n-files
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_STORAGE_PATH=/home/node/.n8n/binaryData

      # UI preferences
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false

    volumes:
      - n8n_data:/home/node/.n8n
      - ../templates:/data/templates:ro
      - ../prompts:/data/prompts:ro
      - ../user-data:/data/user-data
      - ../data:/home/node/.n8n-files/companies:ro

    depends_on:
      latex:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── LaTeX Compiler — PDF generation ────────────────────────
  latex:
    build:
      context: ../services/latex
    container_name: careerforge_latex
    hostname: latex-service
    restart: unless-stopped
    ports:
      - "5679:5679"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5679/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  n8n_data:
